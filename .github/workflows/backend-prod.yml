name: _backend-prod

# Prod's current shape: pull the QA-verified image (no rebuild), retag/push
# straight into prod's own ECR, deploy. The only gate today is the existing
# PR-review requirement on merging qa -> main plus this environment's own
# required reviewers (configured on the `prod` GitHub Environment).
#
# prod-pipeline.png (Stage 3) actually calls for native ECS blue/green with
# test traffic run against the green target group before an automatic
# traffic shift - that's not built here yet, deliberately out of scope for
# this pass (see this repo's CI/CD memory). This file is a same-behavior
# extraction of what the old shared backend-core.yml already did for prod.
#
# Requires a `prod` GitHub Environment with an AWS_ROLE_ARN variable set
# (from scripts/create-deploy-role.sh prod) and an UPSTREAM_ACCOUNT_ID
# variable (qa's account ID - a different account, no safe default).
#
# image_tag is only ever set by a manual workflow_dispatch rollback/redeploy
# now - the normal push trigger leaves it blank, and "Resolve tag to
# promote" below asks qa's ECR directly for its most recently pushed
# (non-candidate) image instead, same reasoning as backend-qa.yml: prod is
# push-triggered, so there's no PR event to read a head SHA from, and
# asking ECR directly works the same regardless of what triggered the run.
# Explicitly excludes qa's candidate-* tags - those are unverified, and
# prod must only ever promote an image qa's own approval gate already
# passed.

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      image_tag:
        description: "Commit SHA to promote or redeploy (manual rollback). Blank = look up qa's latest verified image."
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "Max minutes to wait for the ECS deployment to stabilize. Increase this if a service's Terraform bake_time_in_minutes (BLUE_GREEN) is longer than the default covers."
        required: false
        type: number
        default: 30

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

    steps:
      - uses: ./.github/actions/ecr-login
        id: ecr
        with:
          role_arn: ${{ vars.AWS_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}

      - name: Login to qa's ECR
        id: upstream
        run: |
          UPSTREAM_REGISTRY="${{ vars.UPSTREAM_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "registry=${UPSTREAM_REGISTRY}" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${UPSTREAM_REGISTRY}"

      - name: Resolve tag to promote
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
            echo "Using explicitly provided tag: ${TAG}"
          else
            TAG=$(aws ecr describe-images --region "${AWS_REGION}" \
              --registry-id "${{ vars.UPSTREAM_ACCOUNT_ID }}" \
              --repository-name "${{ inputs.service }}-qa" \
              --query "sort_by(imageDetails[?imageTags && !starts_with(imageTags[0], 'candidate-')], &imagePushedAt)[-1].imageTags[0]" \
              --output text)
            echo "Resolved qa's latest verified tag: ${TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set image URI
        id: image
        run: echo "uri=${{ steps.ecr.outputs.registry }}/${{ inputs.service }}-prod:${{ steps.tag.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Pull, retag, and push (promote)
        run: |
          UPSTREAM_URI="${{ steps.upstream.outputs.registry }}/${{ inputs.service }}-qa:${{ steps.tag.outputs.tag }}"
          docker pull "${UPSTREAM_URI}"
          docker tag "${UPSTREAM_URI}" "${{ steps.image.outputs.uri }}"
          docker push "${{ steps.image.outputs.uri }}"

      - uses: ./.github/actions/ecs-deploy
        with:
          environment: prod
          service: ${{ inputs.service }}
          image_uri: ${{ steps.image.outputs.uri }}
          timeout_minutes: ${{ inputs.timeout_minutes }}
