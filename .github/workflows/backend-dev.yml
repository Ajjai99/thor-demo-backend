name: _backend-dev

# Dev's own shape (Dev-pipeline.png, Stage 1): build from source, run unit
# tests for fast feedback (not a gate — continue-on-error), build the image
# once, scan it with Trivy (a real gate — nothing pushed if it fails), push
# tagged with the commit SHA, deploy. This image is never rebuilt again —
# it's the same artifact backend-qa.yml and backend-prod.yml promote
# forward. Called only by backend-dispatch.yml, never directly.
#
# push_and_deploy: false is how a pull_request preview run reuses this same
# file instead of duplicating the build/test/scan steps elsewhere — every
# step through the Trivy scan still runs (so a PR gets real build-failure
# and vulnerability feedback before merge), it just stops there: no image
# ever gets pushed to ECR and nothing gets deployed. Preview runs also skip
# ecr-login entirely (see "Set image URI" below) — there's nothing to push,
# so there's no reason to assume an AWS role or gate behind a GitHub
# Environment just to build and scan a PR.
#
# Requires a `dev` GitHub Environment with an AWS_ROLE_ARN variable set
# (from scripts/create-deploy-role.sh dev). No required reviewers on dev —
# it's the one fully-automatic stage.

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      push_and_deploy:
        description: "false for a pull_request preview: build/test/scan only, never pushed or deployed."
        required: false
        type: boolean
        default: true
      image_tag:
        description: "Commit SHA to redeploy (manual rollback). Defaults to github.sha."
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "Max minutes to wait for the ECS deployment to stabilize."
        required: false
        type: number
        default: 30

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # No environment (and no AWS role assumption at all) for a preview run —
    # there's nothing to push or deploy, so there's nothing to gate behind.
    environment: ${{ inputs.push_and_deploy && 'dev' || '' }}
    defaults:
      run:
        working-directory: backend/services/${{ inputs.service }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ecr-login
        id: ecr
        if: inputs.push_and_deploy
        with:
          role_arn: ${{ vars.AWS_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}

      # Preview runs still need *some* local tag to build+scan the image
      # under, but there's no registry to push it to, so it's just a
      # throwaway local name — never used past this job.
      - name: Set image URI
        id: image
        run: |
          if [ "${{ inputs.push_and_deploy }}" = "true" ]; then
            echo "uri=${{ steps.ecr.outputs.registry }}/${{ inputs.service }}-dev:${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "uri=preview-${{ inputs.service }}:${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore & build (.NET)
        if: inputs.service != 'intelligence-engine'
        run: |
          dotnet restore
          dotnet build --no-restore -c Release

      # continue-on-error: fast feedback, not a gate — a failing test is
      # visible on the run but doesn't stop the image from being built,
      # scanned, and deployed.
      - name: Run unit tests (.NET)
        if: inputs.service != 'intelligence-engine'
        continue-on-error: true
        run: |
          if find . -iname '*.tests.csproj' | grep -q .; then
            dotnet test --no-build -c Release
          else
            echo "No test project found, skipping."
          fi

      - name: Install dependencies (Python)
        if: inputs.service == 'intelligence-engine'
        run: pip install -r requirements.txt

      - name: Run unit tests (Python)
        if: inputs.service == 'intelligence-engine'
        continue-on-error: true
        run: |
          if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then
            pip install pytest
            pytest
          else
            echo "No tests found, skipping."
          fi

      - name: Build image
        run: docker build -t "${{ steps.image.outputs.uri }}" .

      # Real gate, unlike the unit test steps above — CRITICAL/HIGH findings
      # fail this step (exit-code: 1), which stops the job here: the image
      # is never pushed, so it can never reach ECS or be promoted to qa/prod.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.uri }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Push image
        if: inputs.push_and_deploy
        run: docker push "${{ steps.image.outputs.uri }}"

      - uses: ./.github/actions/ecs-deploy
        if: inputs.push_and_deploy
        with:
          environment: dev
          service: ${{ inputs.service }}
          image_uri: ${{ steps.image.outputs.uri }}
          timeout_minutes: ${{ inputs.timeout_minutes }}
