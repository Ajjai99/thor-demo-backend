name: ECS deploy
description: Registers a new task definition revision pointing at the given image, deploys it, and waits for the rollout (rolling or native blue/green) to stabilize.

inputs:
  environment:
    required: true
  service:
    required: true
  image_uri:
    required: true
  timeout_minutes:
    required: false
    default: "30"

outputs:
  task_definition_arn:
    value: ${{ steps['task-def'].outputs.arn }}

runs:
  using: composite
  steps:
    # Only patches the image and registers a new revision — Terraform owns everything else about the task def's shape.
    - id: task-def
      shell: bash
      run: |
        FAMILY="thor-${{ inputs.environment }}-${{ inputs.service }}"
        CURRENT_TASK_DEF=$(aws ecs describe-task-definition --task-definition "$FAMILY" --query 'taskDefinition' --output json)
        NEW_TASK_DEF=$(echo "$CURRENT_TASK_DEF" | jq --arg IMAGE "${{ inputs.image_uri }}" \
          '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
        NEW_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
        echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

    # Polled manually instead of `aws ecs wait services-stable` — its fixed ~10min timeout can't cover a BLUE_GREEN
    # deploy's full bake time (up to 24h), and rolloutState's BLUE_GREEN support is ambiguous in AWS's own docs.
    - shell: bash
      run: |
        aws ecs update-service \
          --cluster "thor-${{ inputs.environment }}" \
          --service "${{ inputs.service }}" \
          --task-definition "${{ steps['task-def'].outputs.arn }}" \
          >/dev/null

        NEW_TASK_DEF="${{ steps['task-def'].outputs.arn }}"
        TIMEOUT_SECONDS=$(( ${{ inputs.timeout_minutes }} * 60 ))
        INTERVAL=15
        ELAPSED=0

        while true; do
          DEPLOYMENTS=$(aws ecs describe-services \
            --cluster "thor-${{ inputs.environment }}" \
            --services "${{ inputs.service }}" \
            --query 'services[0].deployments' --output json)

          COUNT=$(echo "$DEPLOYMENTS" | jq 'length')

          if [ "$COUNT" -eq 1 ]; then
            STATUS=$(echo "$DEPLOYMENTS" | jq -r '.[0].status')
            TASK_DEF=$(echo "$DEPLOYMENTS" | jq -r '.[0].taskDefinition')
            RUNNING=$(echo "$DEPLOYMENTS" | jq -r '.[0].runningCount')
            DESIRED=$(echo "$DEPLOYMENTS" | jq -r '.[0].desiredCount')

            if [ "$STATUS" = "PRIMARY" ] && [ "$TASK_DEF" = "$NEW_TASK_DEF" ] && [ "$RUNNING" = "$DESIRED" ]; then
              echo "Deployment stable: new task definition is the sole, fully healthy deployment."
              exit 0
            fi

            if [ "$STATUS" = "PRIMARY" ] && [ "$TASK_DEF" != "$NEW_TASK_DEF" ]; then
              echo "Deployment was rolled back: the sole remaining deployment is not the task definition just registered."
              exit 1
            fi
          fi

          FAILED_COUNT=$(echo "$DEPLOYMENTS" | jq -r '[.[] | select(.rolloutState == "FAILED")] | length')
          if [ "$FAILED_COUNT" -gt 0 ]; then
            echo "ECS reported a FAILED rollout state."
            exit 1
          fi

          if [ "$ELAPSED" -ge "$TIMEOUT_SECONDS" ]; then
            echo "Timed out after ${TIMEOUT_SECONDS}s waiting for the deployment to stabilize."
            exit 1
          fi

          sleep "$INTERVAL"
          ELAPSED=$((ELAPSED + INTERVAL))
        done
