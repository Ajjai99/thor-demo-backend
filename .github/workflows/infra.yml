name: Infra

# Every PR touching infra/** (against dev, qa, or main) runs the same four
# checks — init, validate, lint, plan — as four separate, individually
# visible jobs; apply only ever runs on a push to dev/qa/main (i.e. after a
# PR merges), automatically for dev and behind whatever required reviewers
# are configured on qa-infra/prod-infra. pull_request and push are used to
# distinguish preview-only from apply, not action/merged inspection on a
# single event type — a merge fires both pull_request:closed and push for
# the same change, so listening for both would double-apply; not listening
# for pull_request:closed at all avoids that entirely.
#
# One file, no reusable workflow_call split — a PR/push only ever resolves
# to one environment, so there was never a case where the job graph needed
# to run more than once per trigger, unlike backend.yml's per-service calls.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, qa, main]
    paths: ["infra/**"]
  push:
    branches: [dev, qa, main]
    paths: ["infra/**"]

# Serializes runs per target branch (so two close-together dev pushes queue instead of racing) — the S3 backend's lockfile already prevents actual state corruption, this just avoids a losing run failing outright on a lock conflict. cancel-in-progress stays false: killing a run mid-apply could leave infrastructure partially applied.
concurrency:
  group: infra-${{ github.event_name == 'push' && github.ref_name || github.base_ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  context:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set.outputs.environment }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BRANCH="${{ github.ref_name }}"
          else
            BRANCH="${{ github.base_ref }}"
          fi

          if [ "$BRANCH" = "qa" ]; then
            echo "environment=qa" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = "main" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          fi

  init-terragrunt:
    needs: context
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}-infra-plan
    defaults:
      run:
        working-directory: infra/envs/${{ needs.context.outputs.environment }}
    # Every later job requires this one to succeed first (needs chain: validate -> lint -> plan -> apply), so the state bucket only ever needs auto-creating here — by the time any later job runs its own implicit init, it already exists.
    # TG_BACKEND_BOOTSTRAP: without it, a missing state bucket is a hard failure ("S3 bucket ... does not exist"), not something Terragrunt creates on its own — auto-creation is opt-in in this Terragrunt version, confirmed against a real missing-bucket error, not the default behavior TG_NON_INTERACTIVE alone would imply.
    env:
      TG_NON_INTERACTIVE: "true"
      TG_BACKEND_BOOTSTRAP: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          curl -sL -o /usr/local/bin/terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.2/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Fast-fail gate — backend/auth problems surface here before lint/plan spend any time.
      # -reconfigure: without it, a changed remote_state/provider block in root.hcl fails hard ("Error: Backend configuration changed") instead of picking up the new config — confirmed harmless on a genuinely fresh init too (today's normal case, since every job checks out clean).
      - name: terragrunt init
        run: terragrunt init -reconfigure -no-color

  validate-terragrunt:
    needs: [context, init-terragrunt]
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}-infra-plan
    defaults:
      run:
        working-directory: infra/envs/${{ needs.context.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          curl -sL -o /usr/local/bin/terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.2/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: terragrunt validate
        run: terragrunt validate -no-color

  lint-terragrunt:
    needs: [context, validate-terragrunt]
    runs-on: ubuntu-latest
    # Not per-environment — hcl fmt checks the .hcl files under infra/ (root.hcl, envs/*/terragrunt.hcl); tflint checks the shared .tf module code under infra/src. Neither depends on which environment triggered this run.
    steps:
      - uses: actions/checkout@v4

      # No setup-terraform/AWS credentials here — pure static analysis, no provider schema or backend access needed.
      - name: Install Terragrunt
        run: |
          curl -sL -o /usr/local/bin/terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.2/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt

      # Only touches *.hcl files (root.hcl, envs/*/terragrunt.hcl) — recursive by default, so this alone covers every environment's terragrunt.hcl, not just the triggering one.
      - name: terragrunt hcl fmt --check
        working-directory: infra
        run: terragrunt hcl fmt --check

      # Needs infra/src/.tflint.hcl enabling the AWS ruleset plugin — without it tflint only runs generic rules, not the AWS-specific ones reusable modules actually need checked.
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: tflint
        working-directory: infra/src
        run: |
          tflint --init
          tflint --recursive

  plan-terragrunt:
    needs: [context, lint-terragrunt]
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}-infra-plan
    defaults:
      run:
        working-directory: infra/envs/${{ needs.context.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          curl -sL -o /usr/local/bin/terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.2/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # -out uses an absolute /tmp path, not a relative one — terragrunt actually runs terraform from a hashed .terragrunt-cache/... subdirectory, not from this working-directory, so a relative -out path would land somewhere inside that cache maze instead of somewhere upload-artifact can find it.
      - name: terragrunt plan
        id: plan
        run: terragrunt plan -no-color -out=/tmp/tfplan.binary 2>&1 | tee /tmp/plan-output.txt
        continue-on-error: true

      # Only a real plan file if the plan step actually succeeded — nothing to hand off otherwise. Both jobs are fresh runners, so this is how the plan crosses from one to the other, not a shared filesystem.
      - name: Upload plan file
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ needs.context.outputs.environment }}
          path: /tmp/tfplan.binary
          retention-days: 1

      # Every listened-for pull_request type here is a live, open PR (closed isn't in the list) — on a push-triggered run this is simply skipped, no PR to comment on.
      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/plan-output.txt', 'utf8').slice(-60000);
            const marker = `<!-- infra-plan:${{ needs.context.outputs.environment }} -->`;
            const body = `${marker}\n### Terragrunt plan — \`${{ needs.context.outputs.environment }}\` (${{ steps.plan.outcome }})\n<details><summary>Show plan</summary>\n\n\`\`\`\n${output}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: ${{ github.event.pull_request.number }}
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: ${{ github.event.pull_request.number }}, body });
            }

      - name: Fail the job if plan itself failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply-terragrunt:
    needs: [context, plan-terragrunt]
    # Explicit always() + a manual plan-terragrunt.result check, rather than relying on the implicit success-of-all-needs default, so this condition is the single source of truth for whether apply runs.
    if: always() && github.event_name == 'push' && needs['plan-terragrunt'].result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.context.outputs.environment }}-infra-apply
    defaults:
      run:
        working-directory: infra/envs/${{ needs.context.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          curl -sL -o /usr/local/bin/terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.2/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Downloads to /tmp, matching where plan-terragrunt wrote it — same reasoning as the plan step's -out path, an absolute path sidesteps terragrunt's .terragrunt-cache/... execution directory entirely.
      - name: Download plan file
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ needs.context.outputs.environment }}
          path: /tmp

      # Applies the exact plan file plan-terragrunt produced — no -auto-approve needed, applying a saved plan is already non-interactive. If the underlying state changed since that plan was made, this fails with a stale-plan error instead of silently applying something different than what was reviewed.
      - name: terragrunt apply
        run: terragrunt apply -no-color /tmp/tfplan.binary

  seed-ecr-placeholder:
    needs: [context, apply-terragrunt]
    # Same source-of-truth pattern as apply-terragrunt's own condition — on a PR run apply-terragrunt is skipped, not successful, so this naturally no-ops there too without needing its own event_name check.
    if: always() && needs['apply-terragrunt'].result == 'success'
    runs-on: ubuntu-latest
    # Same environment apply-terragrunt just used — GitHub only prompts a required reviewer once per (run, environment), not once per job, so this doesn't add a second approval click.
    environment: ${{ needs.context.outputs.environment }}-infra-apply
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ecr-login
        id: ecr
        with:
          role_arn: ${{ vars.AWS_ROLE_ARN }}
          region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # --platform linux/amd64: same reasoning as placeholder-image/push.sh — Fargate task definitions default to X86_64, so this stays explicit even though ubuntu-latest runners are already x86_64 today.
      # Only pushes to a repo that currently has zero images — never overwrites a real, already-deployed :latest just because an unrelated infra change got applied.
      - name: Seed any empty ECR repo with the placeholder image
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          ENVIRONMENT: ${{ needs.context.outputs.environment }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -t placeholder placeholder-image/

          for svc in thor task-api intelligence-engine; do
            REPO="${svc}-${ENVIRONMENT}"

            if ! aws ecr describe-repositories --repository-names "$REPO" --region "$AWS_REGION" >/dev/null 2>&1; then
              echo "$REPO doesn't exist yet (enable_compute off, or repo not created) — skipping."
              continue
            fi

            IMAGE_COUNT=$(aws ecr describe-images --repository-name "$REPO" --region "$AWS_REGION" --query 'length(imageDetails)' --output text 2>/dev/null || echo 0)
            if [ "$IMAGE_COUNT" != "0" ]; then
              echo "$REPO already has $IMAGE_COUNT image(s) — leaving it alone."
              continue
            fi

            echo "$REPO is empty — pushing placeholder."
            IMAGE="${REGISTRY}/${REPO}:latest"
            docker tag placeholder "$IMAGE"
            docker push "$IMAGE"
          done
