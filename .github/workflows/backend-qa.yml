name: _backend-qa

# QA's own shape (QA-pipeline.png, Stage 2): pull dev's already-tested image
# (no rebuild), deploy it straight onto ECS QA as an unverified candidate,
# run integration tests against that running candidate, then branch:
#   fail -> roll QA back to its last stable revision; nothing written to
#     QA's ECR under the plain <sha> tag.
#   pass -> pause for manual approval, then retag/push the same image bytes
#     into QA's ECR as the verified <service>-qa:<sha> artifact. No redeploy
#     here — the already-tested candidate keeps running as-is; this step
#     only exists so qa->prod promotion (which pulls by that exact tag) has
#     something to pull.
#
# Two GitHub Environments, both needing the SAME AWS_ROLE_ARN variable
# (create-deploy-role.sh qa's output) plus an UPSTREAM_ACCOUNT_ID variable
# (dev's account ID):
#   qa-candidate  - unprotected, no required reviewers. The `deploy` job
#     runs here so the candidate can deploy and be tested automatically,
#     with nothing to approve yet. Also needs an API_BASE_URL variable -
#     thor's QA API Gateway invoke URL, used by the integration-test step.
#   qa            - protected, required reviewers configured here. The
#     `promote` job runs here - this is the only human gate in this file.
#
# The integration-test step is a stub (a health-endpoint curl) until a real
# Postman/Newman suite exists per deployment_strategy_plan.md §8. It always
# hits thor's public endpoint, never task-api/intelligence-engine directly -
# those two have no ingress of their own (only thor is expose_publicly, see
# infra/src/variables.tf), and Service Connect means thor's internal calls
# to whichever service just redeployed reach the new candidate automatically
# (the client-alias DNS name is stable across revisions).
#
# create-deploy-role.sh's trust policy must include BOTH
# environment:qa-candidate and environment:qa as trusted subjects - one IAM
# role, two GitHub Environment names.
#
# image_tag is only ever set by a manual workflow_dispatch rollback/redeploy
# now - the normal push trigger leaves it blank, and "Resolve tag to
# promote" below asks dev's ECR directly for its most recently pushed
# (non-candidate) image instead. That replaced an earlier design that read
# github.event.pull_request.head.sha, back when qa was pull_request-
# triggered; now that qa is push-triggered like dev, that field doesn't
# exist on the event at all, and asking ECR directly works the same way
# regardless of what triggered the run.

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      image_tag:
        description: "Commit SHA to promote or redeploy (manual rollback). Blank = look up dev's latest pushed image."
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "Max minutes to wait for the ECS deployment to stabilize."
        required: false
        type: number
        default: 30

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: qa-candidate
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: ./.github/actions/ecr-login
        id: ecr
        with:
          role_arn: ${{ vars.AWS_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}

      - name: Login to dev's ECR
        id: upstream
        run: |
          UPSTREAM_REGISTRY="${{ vars.UPSTREAM_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "registry=${UPSTREAM_REGISTRY}" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${UPSTREAM_REGISTRY}"

      # Blank image_tag (the normal case) means "whatever dev most recently
      # pushed" - queried directly rather than inferred from any git event,
      # so this works identically for a push trigger or a manual dispatch.
      - name: Resolve tag to promote
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
            echo "Using explicitly provided tag: ${TAG}"
          else
            TAG=$(aws ecr describe-images --region "${AWS_REGION}" \
              --registry-id "${{ vars.UPSTREAM_ACCOUNT_ID }}" \
              --repository-name "${{ inputs.service }}-dev" \
              --query "sort_by(imageDetails[?imageTags && !starts_with(imageTags[0], 'candidate-')], &imagePushedAt)[-1].imageTags[0]" \
              --output text)
            echo "Resolved dev's latest pushed tag: ${TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set candidate image URI
        id: image
        run: echo "candidate_uri=${{ steps.ecr.outputs.registry }}/${{ inputs.service }}-qa:candidate-${{ steps.tag.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Pull dev's image and push as a QA candidate
        run: |
          UPSTREAM_URI="${{ steps.upstream.outputs.registry }}/${{ inputs.service }}-dev:${{ steps.tag.outputs.tag }}"
          docker pull "${UPSTREAM_URI}"
          docker tag "${UPSTREAM_URI}" "${{ steps.image.outputs.candidate_uri }}"
          docker push "${{ steps.image.outputs.candidate_uri }}"

      # The service's actual running definition, not the task-definition
      # family's latest registered revision - those can differ, and it's
      # specifically what's live right now that a failed test must roll
      # back to.
      - name: Capture currently-running task definition
        id: previous
        run: |
          ARN=$(aws ecs describe-services --cluster "thor-qa" --services "${{ inputs.service }}" --query 'services[0].taskDefinition' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/ecs-deploy
        with:
          environment: qa
          service: ${{ inputs.service }}
          image_uri: ${{ steps.image.outputs.candidate_uri }}
          timeout_minutes: ${{ inputs.timeout_minutes }}

      # Stub - see the file header. Real gate: a failure here (or, less
      # likely, a failure in the ecs-deploy step above that the circuit
      # breaker didn't already catch) trips the rollback step below and
      # keeps the `promote` job from ever running.
      - name: Run integration tests against candidate
        run: curl -sf "${{ vars.API_BASE_URL }}/health" > /dev/null

      - name: Roll back QA to last stable revision
        if: failure()
        run: |
          aws ecs update-service \
            --cluster "thor-qa" \
            --service "${{ inputs.service }}" \
            --task-definition "${{ steps.previous.outputs.arn }}" \
            >/dev/null
          echo "Integration tests failed - rolled back to ${{ steps.previous.outputs.arn }}. Nothing promoted to QA's tagged image."

  promote:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    environment: qa
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      # Reuses exactly the tag `deploy` resolved and tested — never
      # re-resolved here, so promote can't end up promoting a different,
      # newer dev image than the one that actually passed the smoke test.
      TAG: ${{ needs.deploy.outputs.tag }}

    steps:
      - uses: ./.github/actions/ecr-login
        id: ecr
        with:
          role_arn: ${{ vars.AWS_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}

      - name: Promote tested candidate to the verified tag
        run: |
          CANDIDATE_URI="${{ steps.ecr.outputs.registry }}/${{ inputs.service }}-qa:candidate-${TAG}"
          VERIFIED_URI="${{ steps.ecr.outputs.registry }}/${{ inputs.service }}-qa:${TAG}"
          docker pull "${CANDIDATE_URI}"
          docker tag "${CANDIDATE_URI}" "${VERIFIED_URI}"
          docker push "${VERIFIED_URI}"
