name: _backend-dispatch

# dev, qa, and prod's pipeline shapes have diverged enough (dev: one job;
# qa: candidate/test/rollback/promote across two jobs; prod: pull-verified-
# and-deploy today, native blue/green later) that they live in their own
# files - backend-dev.yml, backend-qa.yml, backend-prod.yml. Preview runs
# (mode: preview, from a pull_request) route somewhere different again:
# dev previews reuse backend-dev.yml itself (with push_and_deploy: false,
# since dev already has the real build+test+scan steps to stop short of),
# while qa/main previews route to backend-preview.yml instead — qa/prod
# don't build from source at all normally, so there's no equivalent
# "build, but stop before pushing" path in their own files, just a plain
# compile+test sanity check.
#
# This file's whole job is picking the right one, based on the
# environment/mode backend.yml already resolved.
#
# `uses:` can't be a dynamic expression in GitHub Actions, so this fan-out
# has to be static, if-gated jobs rather than one job with a computed path.

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      environment:
        required: true
        type: string
      mode:
        description: "deploy (push-triggered, the real thing) or preview (pull_request, never pushed/deployed)"
        required: true
        type: string
      image_tag:
        required: false
        type: string
        default: ""
      timeout_minutes:
        required: false
        type: number
        default: 30

# id-token: write is never granted by default and has to be explicitly
# re-declared at every hop of a reusable-workflow chain — this file doesn't
# use it directly (it only routes via `uses:`), but without declaring it
# here too, every downstream backend-dev/qa/prod.yml call would be capped
# down to id-token: none regardless of what they themselves request.
permissions:
  id-token: write
  contents: read

jobs:
  dev-deploy:
    if: inputs.environment == 'dev' && inputs.mode == 'deploy'
    uses: ./.github/workflows/backend-dev.yml
    with:
      service: ${{ inputs.service }}
      image_tag: ${{ inputs.image_tag }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      push_and_deploy: true
    secrets: inherit

  dev-preview:
    if: inputs.environment == 'dev' && inputs.mode == 'preview'
    uses: ./.github/workflows/backend-dev.yml
    with:
      service: ${{ inputs.service }}
      push_and_deploy: false
    secrets: inherit

  qa:
    if: inputs.environment == 'qa' && inputs.mode == 'deploy'
    uses: ./.github/workflows/backend-qa.yml
    with:
      service: ${{ inputs.service }}
      image_tag: ${{ inputs.image_tag }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
    secrets: inherit

  prod:
    if: inputs.environment == 'prod' && inputs.mode == 'deploy'
    uses: ./.github/workflows/backend-prod.yml
    with:
      service: ${{ inputs.service }}
      image_tag: ${{ inputs.image_tag }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
    secrets: inherit

  preview:
    if: inputs.mode == 'preview' && inputs.environment != 'dev'
    uses: ./.github/workflows/backend-preview.yml
    with:
      service: ${{ inputs.service }}
    secrets: inherit
