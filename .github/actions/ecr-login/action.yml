name: ECR login
description: Assumes the given AWS role via OIDC and logs Docker in to this account's own ECR registry.

inputs:
  role_arn:
    required: true
  region:
    required: false
    default: us-east-1

outputs:
  registry:
    value: ${{ steps.registry.outputs.registry }}

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role_arn }}
        aws-region: ${{ inputs.region }}

    - id: registry
      shell: bash
      run: |
        ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
        echo "registry=${ACCOUNT}.dkr.ecr.${{ inputs.region }}.amazonaws.com" >> "$GITHUB_OUTPUT"

    - shell: bash
      run: aws ecr get-login-password --region "${{ inputs.region }}" | docker login --username AWS --password-stdin "${{ steps.registry.outputs.registry }}"
