name: Deploy

# Entry point — decides environment/mode/which service(s) changed, then calls _deploy-core.yml. Replaces backend.yml + backend-dispatch.yml.
#
# push to dev -> deploy (build from source); push to qa/main -> promote (reads the manifest your own dev->qa / qa->main promotion PR carried over); pull_request -> preview only, via deploy-preview.yml; workflow_dispatch -> manual deploy/rollback.
#
# dorny/paths-filter decides which service(s) changed: source filters on push to dev, manifest filters (deploy/<service>/<env>-image.json) on push to qa/main.

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, qa, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options: [dev, qa, prod]
      service:
        description: "Service to deploy"
        required: true
        type: choice
        options: [thor, task-api, intelligence-engine]
      image_digest:
        description: "JFrog digest to deploy (blank = normal resolution for this environment's trigger)"
        required: false
        type: string

# Permissions don't propagate through a workflow_call boundary — re-declared here for _deploy-core.yml's use.
permissions:
  id-token: write
  contents: write

jobs:
  detect-changes:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      thor-source: ${{ steps.filter.outputs['thor-source'] }}
      thor-manifest: ${{ steps.filter.outputs['thor-manifest'] }}
      task-api-source: ${{ steps.filter.outputs['task-api-source'] }}
      task-api-manifest: ${{ steps.filter.outputs['task-api-manifest'] }}
      intelligence-engine-source: ${{ steps.filter.outputs['intelligence-engine-source'] }}
      intelligence-engine-manifest: ${{ steps.filter.outputs['intelligence-engine-manifest'] }}
    steps:
      # dorny/paths-filter needs full history to diff, or it fails open (matches everything).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # base defaults to main when ref != base, so push to dev/qa would diff against main instead of their own
      # previous commit — set to the branch itself to fix that; left blank on pull_request, whose default (the PR's base branch) is already correct.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.ref_name || '' }}
          filters: |
            thor-source:
              - 'backend/services/thor/**'
              - 'backend/shared/**'
            thor-manifest:
              - 'deploy/thor/*.json'
            task-api-source:
              - 'backend/services/task-api/**'
              - 'backend/shared/**'
            task-api-manifest:
              - 'deploy/task-api/*.json'
            intelligence-engine-source:
              - 'backend/services/intelligence-engine/**'
              - 'backend/shared/**'
            intelligence-engine-manifest:
              - 'deploy/intelligence-engine/*.json'

  context:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: detect-changes
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set.outputs.environment }}
      mode: ${{ steps.set.outputs.mode }}
      thor: ${{ steps.set.outputs.thor }}
      task-api: ${{ steps.set.outputs['task-api'] }}
      intelligence-engine: ${{ steps.set.outputs['intelligence-engine'] }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BRANCH="${{ github.ref_name }}"
          else
            BRANCH="${{ github.base_ref }}"
          fi

          case "$BRANCH" in
            qa)   ENVIRONMENT="qa";   MODE="promote" ;;
            main) ENVIRONMENT="prod"; MODE="promote" ;;
            *)    ENVIRONMENT="dev";  MODE="deploy" ;;
          esac

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MODE="preview"
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          # Preview only ever needs the source filter — a PR never touches manifest files.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "thor=${{ needs['detect-changes'].outputs['thor-source'] }}" >> "$GITHUB_OUTPUT"
            echo "task-api=${{ needs['detect-changes'].outputs['task-api-source'] }}" >> "$GITHUB_OUTPUT"
            echo "intelligence-engine=${{ needs['detect-changes'].outputs['intelligence-engine-source'] }}" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = "dev" ]; then
            echo "thor=${{ needs['detect-changes'].outputs['thor-source'] }}" >> "$GITHUB_OUTPUT"
            echo "task-api=${{ needs['detect-changes'].outputs['task-api-source'] }}" >> "$GITHUB_OUTPUT"
            echo "intelligence-engine=${{ needs['detect-changes'].outputs['intelligence-engine-source'] }}" >> "$GITHUB_OUTPUT"
          else
            echo "thor=${{ needs['detect-changes'].outputs['thor-manifest'] }}" >> "$GITHUB_OUTPUT"
            echo "task-api=${{ needs['detect-changes'].outputs['task-api-manifest'] }}" >> "$GITHUB_OUTPUT"
            echo "intelligence-engine=${{ needs['detect-changes'].outputs['intelligence-engine-manifest'] }}" >> "$GITHUB_OUTPUT"
          fi

  deploy-thor:
    needs: context
    if: needs.context.outputs.mode != 'preview' && needs.context.outputs.thor == 'true'
    uses: ./.github/workflows/_deploy-core.yml
    with:
      service: thor
      environment: ${{ needs.context.outputs.environment }}
      mode: ${{ needs.context.outputs.mode }}
    secrets: inherit

  deploy-task-api:
    needs: context
    if: needs.context.outputs.mode != 'preview' && needs.context.outputs['task-api'] == 'true'
    uses: ./.github/workflows/_deploy-core.yml
    with:
      service: task-api
      environment: ${{ needs.context.outputs.environment }}
      mode: ${{ needs.context.outputs.mode }}
    secrets: inherit

  deploy-intelligence-engine:
    needs: context
    if: needs.context.outputs.mode != 'preview' && needs.context.outputs['intelligence-engine'] == 'true'
    uses: ./.github/workflows/_deploy-core.yml
    with:
      service: intelligence-engine
      environment: ${{ needs.context.outputs.environment }}
      mode: ${{ needs.context.outputs.mode }}
    secrets: inherit

  preview-thor:
    needs: context
    if: needs.context.outputs.mode == 'preview' && needs.context.outputs.thor == 'true'
    uses: ./.github/workflows/deploy-preview.yml
    with:
      service: thor
    secrets: inherit

  preview-task-api:
    needs: context
    if: needs.context.outputs.mode == 'preview' && needs.context.outputs['task-api'] == 'true'
    uses: ./.github/workflows/deploy-preview.yml
    with:
      service: task-api
    secrets: inherit

  preview-intelligence-engine:
    needs: context
    if: needs.context.outputs.mode == 'preview' && needs.context.outputs['intelligence-engine'] == 'true'
    uses: ./.github/workflows/deploy-preview.yml
    with:
      service: intelligence-engine
    secrets: inherit

  deploy-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_deploy-core.yml
    with:
      service: ${{ inputs.service }}
      environment: ${{ inputs.environment }}
      mode: ${{ inputs.environment == 'dev' && 'deploy' || 'promote' }}
      image_digest: ${{ inputs.image_digest }}
    secrets: inherit
