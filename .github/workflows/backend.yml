name: Backend

# Two real triggers, both calling backend-dispatch.yml, which routes to
# whichever of backend-dev.yml / backend-qa.yml / backend-prod.yml /
# backend-preview.yml actually applies:
#   - push to dev/qa/main -> the real thing: dev builds from source and
#     deploys; qa deploys an unverified candidate, tests it, and gates
#     promotion behind approval; prod pulls qa's verified image and deploys.
#     A merge produces exactly one push to the target branch, so this is
#     the only trigger that ever mutates anything.
#   - pull_request (opened/synchronize/reopened) against dev/qa/main ->
#     preview only, never touches ECR or ECS. For dev, that's the real
#     build+test+image-scan steps, stopping right before push. For qa/main,
#     there's no source image to build (they promote, they don't build), so
#     it's just a compile+unit-test sanity check.
#
# qa/prod no longer read github.event.pull_request.head.sha to know which
# image to promote — now that they're push-triggered like dev, that field
# doesn't exist on the event at all. Instead each of backend-qa.yml /
# backend-prod.yml asks the upstream environment's ECR directly for its
# most recently pushed (non-candidate) image and promotes that — see their
# own "Resolve tag to promote" step. This is also event-agnostic, so manual
# dispatch rollback and the normal push trigger share the same logic.
#
# Path-aware: dorny/paths-filter decides which service(s) actually changed,
# so an intelligence-engine-only change doesn't rebuild/redeploy thor.
#
# Manual dispatch covers rollback (redeploy an older image_tag) or deploying
# a specific service/environment/tag combination outside the normal flow.

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, qa, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options: [dev, qa, prod]
      service:
        description: "Service to deploy"
        required: true
        type: choice
        options: [thor, task-api, intelligence-engine]
      image_tag:
        description: "Commit SHA to deploy (blank = latest for this environment's normal trigger)"
        required: false
        type: string

# id-token: write is never granted by default — it has to be explicitly
# declared at every hop of a reusable-workflow chain, not just the leaf
# workflow that actually assumes an AWS role via OIDC. Missing here (or in
# backend-dispatch.yml) caps every downstream backend-dev/qa/prod.yml call
# down to id-token: none regardless of what they themselves declare.
permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      thor: ${{ steps.filter.outputs.thor }}
      task-api: ${{ steps.filter.outputs['task-api'] }}
      intelligence-engine: ${{ steps.filter.outputs['intelligence-engine'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            thor:
              - 'backend/services/thor/**'
            task-api:
              - 'backend/services/task-api/**'
            intelligence-engine:
              - 'backend/services/intelligence-engine/**'

  # mode: "deploy" on push (the real thing), "preview" on pull_request
  # (build/test/scan only, never pushed or deployed).
  context:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set.outputs.environment }}
      mode: ${{ steps.set.outputs.mode }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BRANCH="${{ github.ref_name }}"
            echo "mode=deploy" >> "$GITHUB_OUTPUT"
          else
            BRANCH="${{ github.base_ref }}"
            echo "mode=preview" >> "$GITHUB_OUTPUT"
          fi

          if [ "$BRANCH" = "qa" ]; then
            echo "environment=qa" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = "main" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          fi

  deploy-thor:
    needs: [detect-changes, context]
    if: needs['detect-changes'].outputs.thor == 'true'
    uses: ./.github/workflows/backend-dispatch.yml
    with:
      service: thor
      environment: ${{ needs.context.outputs.environment }}
      mode: ${{ needs.context.outputs.mode }}
    secrets: inherit

  deploy-task-api:
    needs: [detect-changes, context]
    if: needs['detect-changes'].outputs['task-api'] == 'true'
    uses: ./.github/workflows/backend-dispatch.yml
    with:
      service: task-api
      environment: ${{ needs.context.outputs.environment }}
      mode: ${{ needs.context.outputs.mode }}
    secrets: inherit

  deploy-intelligence-engine:
    needs: [detect-changes, context]
    if: needs['detect-changes'].outputs['intelligence-engine'] == 'true'
    uses: ./.github/workflows/backend-dispatch.yml
    with:
      service: intelligence-engine
      environment: ${{ needs.context.outputs.environment }}
      mode: ${{ needs.context.outputs.mode }}
    secrets: inherit

  deploy-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/backend-dispatch.yml
    with:
      service: ${{ inputs.service }}
      environment: ${{ inputs.environment }}
      mode: deploy
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
