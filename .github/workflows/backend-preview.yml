name: _backend-preview

# PR-preview check for qa and main: neither environment builds from source
# (they promote an already-built image — see backend-qa.yml / backend-prod.yml),
# so there's no image to build or scan here. This just confirms the code in
# the PR still compiles and its unit tests still pass — the same restore/
# build/test steps backend-dev.yml runs for real, minus everything Docker-
# or AWS-related, since a PR into qa/main hasn't been promoted anywhere yet.
#
# No `environment:`, no OIDC permissions, no AWS credentials — nothing here
# needs them.

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/services/${{ inputs.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Restore & build (.NET)
        if: inputs.service != 'intelligence-engine'
        run: |
          dotnet restore
          dotnet build --no-restore -c Release

      # continue-on-error: fast feedback, not a gate — matches
      # backend-dev.yml's own unit-test steps.
      - name: Run unit tests (.NET)
        if: inputs.service != 'intelligence-engine'
        continue-on-error: true
        run: |
          if find . -iname '*.tests.csproj' | grep -q .; then
            dotnet test --no-build -c Release
          else
            echo "No test project found, skipping."
          fi

      - name: Install dependencies (Python)
        if: inputs.service == 'intelligence-engine'
        run: pip install -r requirements.txt

      - name: Run unit tests (Python)
        if: inputs.service == 'intelligence-engine'
        continue-on-error: true
        run: |
          if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then
            pip install pytest
            pytest
          else
            echo "No tests found, skipping."
          fi
