name: Manifest write
description: Writes a deploy/<service>/<environment>-image.json manifest and commits it straight onto the branch that triggered this run. The next environment's own regular branch-promotion PR carries the manifest file forward. Requires the caller to have already run actions/checkout@v4 earlier in the job.

inputs:
  service:
    required: true
  environment:
    description: The environment that just deployed (dev, qa, or prod).
    required: true
  digest:
    description: Image digest (JFrog artifact digest) being promoted
    required: true
  commit_id:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        mkdir -p "deploy/${{ inputs.service }}"
        cat > "deploy/${{ inputs.service }}/${{ inputs.environment }}-image.json" <<EOF
        {
          "service": "${{ inputs.service }}",
          "environment": "${{ inputs.environment }}",
          "digest": "${{ inputs.digest }}",
          "commitId": "${{ inputs.commit_id }}",
          "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        }
        EOF

    - shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "deploy/${{ inputs.service }}/${{ inputs.environment }}-image.json"
        git commit -m "chore(deploy): record ${{ inputs.service }} ${{ inputs.environment }} deployment (${{ inputs.digest }})" || echo "No changes to commit"
        git push
