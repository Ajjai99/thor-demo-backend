name: ECS deploy
description: Registers a new task definition revision pointing at the given image, deploys it, and waits until the new revision is primary and healthy (not the full BLUE_GREEN bake/old-revision teardown). Also redeploys the other two of thor-api/task-api/intelligence-engine with their current image (no rebuild) at the same time, so all three deployments run concurrently instead of one after another — unless changed_services says a sibling has its own deploy job this run, in which case it's skipped to avoid two jobs targeting the same ECS service at once.

inputs:
  environment:
    required: true
  service:
    required: true
  image_uri:
    required: true
  timeout_minutes:
    required: false
    default: "30"
  changed_services:
    description: "Comma-separated services also getting their own deploy job this run. Blank means this is the only service deploying, so both siblings get synced normally."
    required: false
    default: ""

outputs:
  task_definition_arn:
    value: ${{ steps.deploy.outputs.arn }}

runs:
  using: composite
  steps:
    # deploy_and_wait runs as a background job (&) for the main service and both siblings, so all three deploys
    # (and any BLUE_GREEN bake) run concurrently — async commands are exempt from bash -e, so only `wait` needs its own error handling.
    - id: deploy
      shell: bash
      run: |
        deploy_and_wait() {
          local SERVICE="$1"
          local IMAGE_URI="$2"

          # Only patches the image and registers a new revision — Terraform owns everything else about the task def's shape.
          local FAMILY="thor-${{ inputs.environment }}-${SERVICE}"
          local CURRENT_TASK_DEF
          CURRENT_TASK_DEF=$(aws ecs describe-task-definition --task-definition "$FAMILY" --query 'taskDefinition' --output json)
          local NEW_TASK_DEF
          NEW_TASK_DEF=$(echo "$CURRENT_TASK_DEF" | jq --arg IMAGE "$IMAGE_URI" \
            '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
          local NEW_ARN
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)

          # BLUE_GREEN rejects update-service with no --load-balancers at all — AWS requires the full config
          # re-passed on every update. Re-reads what's currently on the service and passes it straight back; services with none get an empty array and the flag is skipped.
          local LOAD_BALANCERS
          LOAD_BALANCERS=$(aws ecs describe-services \
            --cluster "thor-${{ inputs.environment }}" \
            --services "$SERVICE" \
            --query 'services[0].loadBalancers' --output json)

          if [ "$(echo "$LOAD_BALANCERS" | jq 'length')" -gt 0 ]; then
            aws ecs update-service \
              --cluster "thor-${{ inputs.environment }}" \
              --service "$SERVICE" \
              --task-definition "$NEW_ARN" \
              --load-balancers "$LOAD_BALANCERS" \
              >/dev/null
          else
            aws ecs update-service \
              --cluster "thor-${{ inputs.environment }}" \
              --service "$SERVICE" \
              --task-definition "$NEW_ARN" \
              >/dev/null
          fi

          # Polled manually — aws ecs wait services-stable's fixed ~10min timeout can't cover a full BLUE_GREEN bake.
          # Succeeds as soon as OUR new revision is primary and healthy — doesn't wait for the old revision's
          # bake/teardown to finish, since cutover already happened by this point (bake is just AWS's own
          # post-cutover monitoring window, with no CloudWatch alarms wired in to actually act on it today).
          local TIMEOUT_SECONDS=$(( ${{ inputs.timeout_minutes }} * 60 ))
          local INTERVAL=15
          local ELAPSED=0

          while true; do
            local DEPLOYMENTS
            DEPLOYMENTS=$(aws ecs describe-services \
              --cluster "thor-${{ inputs.environment }}" \
              --services "$SERVICE" \
              --query 'services[0].deployments' --output json)

            local NEW_DEPLOYMENT
            NEW_DEPLOYMENT=$(echo "$DEPLOYMENTS" | jq --arg ARN "$NEW_ARN" '[.[] | select(.taskDefinition == $ARN)][0]')

            if [ "$NEW_DEPLOYMENT" != "null" ]; then
              local STATUS RUNNING DESIRED
              STATUS=$(echo "$NEW_DEPLOYMENT" | jq -r '.status')
              RUNNING=$(echo "$NEW_DEPLOYMENT" | jq -r '.runningCount')
              DESIRED=$(echo "$NEW_DEPLOYMENT" | jq -r '.desiredCount')

              if [ "$STATUS" = "PRIMARY" ] && [ "$RUNNING" = "$DESIRED" ]; then
                echo "[$SERVICE] New revision is primary and healthy — not waiting for bake/old-revision teardown." >&2
                echo "$NEW_ARN"
                return 0
              fi
            fi

            local COUNT
            COUNT=$(echo "$DEPLOYMENTS" | jq 'length')

            if [ "$COUNT" -eq 1 ]; then
              local SOLE_STATUS SOLE_TASK_DEF
              SOLE_STATUS=$(echo "$DEPLOYMENTS" | jq -r '.[0].status')
              SOLE_TASK_DEF=$(echo "$DEPLOYMENTS" | jq -r '.[0].taskDefinition')

              if [ "$SOLE_STATUS" = "PRIMARY" ] && [ "$SOLE_TASK_DEF" != "$NEW_ARN" ]; then
                echo "[$SERVICE] Deployment was rolled back: the sole remaining deployment is not the task definition just registered." >&2
                return 1
              fi
            fi

            local FAILED_COUNT
            FAILED_COUNT=$(echo "$DEPLOYMENTS" | jq -r '[.[] | select(.rolloutState == "FAILED")] | length')
            if [ "$FAILED_COUNT" -gt 0 ]; then
              echo "[$SERVICE] ECS reported a FAILED rollout state." >&2
              return 1
            fi

            if [ "$ELAPSED" -ge "$TIMEOUT_SECONDS" ]; then
              echo "[$SERVICE] Timed out after ${TIMEOUT_SECONDS}s waiting to stabilize." >&2
              return 1
            fi

            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done
        }

        declare -A PIDS
        declare -A ARNFILES

        start_deploy() {
          local SERVICE="$1"
          local IMAGE_URI="$2"
          local ARNFILE
          ARNFILE=$(mktemp)
          ARNFILES["$SERVICE"]="$ARNFILE"
          ( deploy_and_wait "$SERVICE" "$IMAGE_URI" > "$ARNFILE" ) &
          PIDS["$SERVICE"]=$!
        }

        start_deploy "${{ inputs.service }}" "${{ inputs.image_uri }}"

        # When several services change in one push, each gets its own deploy job — only the first of them (fixed
        # thor-api/task-api/intelligence-engine order) also syncs whichever services stayed the same, so no two jobs
        # ever target the same ECS service at once. Blank changed_services (single-service runs, manual dispatch)
        # always syncs both siblings, same as before.
        PRIMARY=""
        for S in thor-api task-api intelligence-engine; do
          case ",${{ inputs.changed_services }}," in
            *",$S,"*) PRIMARY="$S"; break ;;
          esac
        done

        if [ -z "${{ inputs.changed_services }}" ] || [ "$PRIMARY" = "${{ inputs.service }}" ]; then
          for SIBLING in thor-api task-api intelligence-engine; do
            if [ "$SIBLING" != "${{ inputs.service }}" ]; then
              case ",${{ inputs.changed_services }}," in
                *",$SIBLING,"*)
                  echo "[$SIBLING] Skipping sync — it changed too and has its own deploy job this run." >&2
                  continue
                  ;;
              esac
              SIBLING_IMAGE=$(aws ecs describe-task-definition --task-definition "thor-${{ inputs.environment }}-${SIBLING}" --query 'taskDefinition.containerDefinitions[0].image' --output text)
              start_deploy "$SIBLING" "$SIBLING_IMAGE"
            fi
          done
        fi

        FAILED=0
        for SERVICE in "${!PIDS[@]}"; do
          wait "${PIDS[$SERVICE]}" || FAILED=1
        done

        if [ "$FAILED" -ne 0 ]; then
          echo "One or more of thor-api/task-api/intelligence-engine failed to deploy — see the [service] log lines above." >&2
          exit 1
        fi

        echo "arn=$(cat "${ARNFILES[${{ inputs.service }}]}")" >> "$GITHUB_OUTPUT"
