name: _deploy-core

# Reusable workflow for all three environments — replaces backend-dispatch.yml + backend-dev.yml + backend-qa.yml + backend-prod.yml. Called only by deploy.yml.
#
# JFrog is the source of truth for built images: dev builds once and publishes there; qa/prod only ever pull by digest from JFrog, never from another environment's ECR, using the digest recorded in deploy/<service>/<env>-image.json.
#
# Each job commits its own manifest straight onto its own branch — the upstream environment's normal, human-merged promotion PR (dev -> qa, qa -> main) carries it forward, so the downstream job just reads it off its own branch.

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      environment:
        description: "dev, qa, or prod"
        required: true
        type: string
      mode:
        description: "deploy (build from source, dev only) or promote (read a manifest and move a pre-built artifact forward, qa/prod)"
        required: true
        type: string
      image_digest:
        description: "JFrog digest to promote/redeploy (manual rollback). Blank = read it from the upstream environment's manifest."
        required: false
        type: string
        default: ""
      timeout_minutes:
        description: "Max minutes to wait for the ECS deployment to stabilize."
        required: false
        type: number
        default: 30

# contents: write is for manifest-write's commits.
permissions:
  id-token: write
  contents: write

jobs:
  dev:
    if: inputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: backend/services/${{ inputs.service }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ecr-login
        id: ecr
        with:
          role_arn: ${{ inputs.environment == 'dev' && vars.DEV_AWS_ROLE_ARN || inputs.environment == 'qa' && vars.QA_AWS_ROLE_ARN || inputs.environment == 'prod' && vars.PROD_AWS_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/jfrog-login
        id: jfrog
        with:
          jfrog_url: ${{ vars.JFROG_URL }}
          jfrog_username: ${{ vars.JFROG_USERNAME }}
          jfrog_access_token: ${{ secrets.JFROG_ACCESS_TOKEN }}

      - name: Set image URIs
        id: image
        run: |
          echo "jfrog_uri=${{ steps.jfrog.outputs.registry }}/${{ vars.DOCKER_REPOSITORY }}/${{ inputs.service }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "ecr_uri=${{ steps.ecr.outputs.registry }}/${{ inputs.service }}-dev:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Restore & build (.NET)
        if: inputs.service != 'intelligence-engine'
        run: |
          dotnet restore
          dotnet build --no-restore -c Release

      # continue-on-error: fast feedback, not a gate.
      - name: Run unit tests (.NET)
        if: inputs.service != 'intelligence-engine'
        continue-on-error: true
        run: |
          if find . -iname '*.tests.csproj' | grep -q .; then
            dotnet test --no-build -c Release
          else
            echo "No test project found, skipping."
          fi

      - name: Install dependencies (Python)
        if: inputs.service == 'intelligence-engine'
        run: pip install -r requirements.txt

      - name: Run unit tests (Python)
        if: inputs.service == 'intelligence-engine'
        continue-on-error: true
        run: |
          if [ -d tests ] || ls test_*.py >/dev/null 2>&1; then
            pip install pytest
            pytest
          else
            echo "No tests found, skipping."
          fi

      # --no-cache avoids stale dependency layers.
      - name: Build image
        run: docker build --no-cache -t "${{ steps.image.outputs.jfrog_uri }}" .

      - name: Publish to JFrog
        run: docker push "${{ steps.image.outputs.jfrog_uri }}"

      # Pinned digest, not just the mutable tag — what downstream promotion actually pulls.
      - name: Capture JFrog digest
        id: digest
        run: |
          FULL_REF=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.image.outputs.jfrog_uri }}")
          echo "ref=${FULL_REF}" >> "$GITHUB_OUTPUT"

      - name: Promote into dev's own ECR
        run: |
          docker tag "${{ steps.image.outputs.jfrog_uri }}" "${{ steps.image.outputs.ecr_uri }}"
          docker push "${{ steps.image.outputs.ecr_uri }}"

      - uses: ./.github/actions/ecs-deploy
        with:
          environment: dev
          service: ${{ inputs.service }}
          image_uri: ${{ steps.image.outputs.ecr_uri }}
          timeout_minutes: ${{ inputs.timeout_minutes }}

      # Commits straight onto dev; dev -> qa's promotion PR carries it forward for qa-deploy to read.
      - uses: ./.github/actions/manifest-write
        with:
          service: ${{ inputs.service }}
          environment: dev
          digest: ${{ steps.digest.outputs.ref }}
          commit_id: ${{ github.sha }}

  qa-deploy:
    if: inputs.environment == 'qa'
    runs-on: ubuntu-latest
    environment: qa-candidate
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      tag: ${{ steps.manifest.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ecr-login
        id: ecr
        with:
          role_arn: ${{ inputs.environment == 'dev' && vars.DEV_AWS_ROLE_ARN || inputs.environment == 'qa' && vars.QA_AWS_ROLE_ARN || inputs.environment == 'prod' && vars.PROD_AWS_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/jfrog-login
        id: jfrog
        with:
          jfrog_url: ${{ vars.JFROG_URL }}
          jfrog_username: ${{ vars.JFROG_USERNAME }}
          jfrog_access_token: ${{ secrets.JFROG_ACCESS_TOKEN }}

      # Blank image_digest = read the digest dev's manifest recorded.
      - name: Read manifest / resolve digest to promote
        id: manifest
        run: |
          if [ -n "${{ inputs.image_digest }}" ]; then
            DIGEST="${{ inputs.image_digest }}"
            TAG="manual-$(echo "${DIGEST}" | sed 's/.*@sha256://' | cut -c1-12)"
            echo "Using explicitly provided digest: ${DIGEST}"
          else
            DIGEST=$(jq -r '.digest' "deploy/${{ inputs.service }}/dev-image.json")
            TAG=$(jq -r '.commitId' "deploy/${{ inputs.service }}/dev-image.json")
            echo "Resolved dev's manifest digest: ${DIGEST}"
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set candidate image URI
        id: image
        run: echo "candidate_uri=${{ steps.ecr.outputs.registry }}/${{ inputs.service }}-qa:candidate-${{ steps.manifest.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Pull from JFrog and push as a QA candidate
        run: |
          docker pull "${{ steps.manifest.outputs.digest }}"
          docker tag "${{ steps.manifest.outputs.digest }}" "${{ steps.image.outputs.candidate_uri }}"
          docker push "${{ steps.image.outputs.candidate_uri }}"

      # The actually-running definition, not just the latest registered revision — what rollback needs.
      - name: Capture currently-running task definition
        id: previous
        run: |
          ARN=$(aws ecs describe-services --cluster "thor-qa" --services "${{ inputs.service }}" --query 'services[0].taskDefinition' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/ecs-deploy
        with:
          environment: qa
          service: ${{ inputs.service }}
          image_uri: ${{ steps.image.outputs.candidate_uri }}
          timeout_minutes: ${{ inputs.timeout_minutes }}

      # Stub — see deployment_strategy_plan.md §8. Always passes for now.
      - name: Run integration tests against candidate
        run: echo "::warning::Real integration test suite not implemented yet — this step always passes for now."

      - name: Roll back QA to last stable revision
        if: failure()
        run: |
          aws ecs update-service \
            --cluster "thor-qa" \
            --service "${{ inputs.service }}" \
            --task-definition "${{ steps.previous.outputs.arn }}" \
            >/dev/null
          echo "Integration tests failed - rolled back to ${{ steps.previous.outputs.arn }}. Nothing promoted to QA's tagged image."

  qa-promote:
    needs: qa-deploy
    if: inputs.environment == 'qa' && needs['qa-deploy'].result == 'success'
    runs-on: ubuntu-latest
    environment: qa
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ecr-login
        id: ecr
        with:
          role_arn: ${{ inputs.environment == 'dev' && vars.DEV_AWS_ROLE_ARN || inputs.environment == 'qa' && vars.QA_AWS_ROLE_ARN || inputs.environment == 'prod' && vars.PROD_AWS_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}

      - name: Promote tested candidate to the verified tag
        run: |
          CANDIDATE_URI="${{ steps.ecr.outputs.registry }}/${{ inputs.service }}-qa:candidate-${{ needs['qa-deploy'].outputs.tag }}"
          VERIFIED_URI="${{ steps.ecr.outputs.registry }}/${{ inputs.service }}-qa:${{ needs['qa-deploy'].outputs.tag }}"
          docker pull "${CANDIDATE_URI}"
          docker tag "${CANDIDATE_URI}" "${VERIFIED_URI}"
          docker push "${VERIFIED_URI}"

      # Commits straight onto qa; qa -> main's promotion PR carries it forward for prod to read.
      - uses: ./.github/actions/manifest-write
        with:
          service: ${{ inputs.service }}
          environment: qa
          digest: ${{ needs['qa-deploy'].outputs.digest }}
          commit_id: ${{ needs['qa-deploy'].outputs.tag }}

  prod:
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ecr-login
        id: ecr
        with:
          role_arn: ${{ inputs.environment == 'dev' && vars.DEV_AWS_ROLE_ARN || inputs.environment == 'qa' && vars.QA_AWS_ROLE_ARN || inputs.environment == 'prod' && vars.PROD_AWS_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}

      - name: Read manifest / resolve digest to promote
        id: manifest
        run: |
          if [ -n "${{ inputs.image_digest }}" ]; then
            DIGEST="${{ inputs.image_digest }}"
            TAG="manual-$(echo "${DIGEST}" | sed 's/.*@sha256://' | cut -c1-12)"
            echo "Using explicitly provided digest: ${DIGEST}"
          else
            DIGEST=$(jq -r '.digest' "deploy/${{ inputs.service }}/qa-image.json")
            TAG=$(jq -r '.commitId' "deploy/${{ inputs.service }}/qa-image.json")
            echo "Resolved qa's manifest digest: ${DIGEST}"
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set image URI
        id: image
        run: echo "uri=${{ steps.ecr.outputs.registry }}/${{ inputs.service }}-prod:${{ steps.manifest.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Pull from JFrog and push into prod's ECR
        run: |
          docker pull "${{ steps.manifest.outputs.digest }}"
          docker tag "${{ steps.manifest.outputs.digest }}" "${{ steps.image.outputs.uri }}"
          docker push "${{ steps.image.outputs.uri }}"

      - uses: ./.github/actions/ecs-deploy
        with:
          environment: prod
          service: ${{ inputs.service }}
          image_uri: ${{ steps.image.outputs.uri }}
          timeout_minutes: ${{ inputs.timeout_minutes }}

      # Nothing downstream reads prod's manifest — this is an audit record only.
      - uses: ./.github/actions/manifest-write
        with:
          service: ${{ inputs.service }}
          environment: prod
          digest: ${{ steps.manifest.outputs.digest }}
          commit_id: ${{ steps.manifest.outputs.tag }}
